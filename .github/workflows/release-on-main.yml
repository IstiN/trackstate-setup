name: Release on main

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-on-main
  cancel-in-progress: false

jobs:
  publish-release:
    name: Publish semantic release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout setup repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Determine next semantic version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          EXISTING_HEAD_TAG="$(git tag --points-at "$GITHUB_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [[ -n "$EXISTING_HEAD_TAG" ]]; then
            echo "next_version=$EXISTING_HEAD_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_TAG="$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [[ -z "$LATEST_TAG" ]]; then
            NEXT_VERSION="v0.0.1"
          else
            VERSION_PART="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_PART"
            PATCH=$((PATCH + 1))
            NEXT_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          NEXT_VERSION="${{ steps.version.outputs.next_version }}"
          if gh release view "$NEXT_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $NEXT_VERSION already exists."
            exit 0
          fi

          gh release create "$NEXT_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$NEXT_VERSION" \
            --generate-notes

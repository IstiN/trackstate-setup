name: Actionlint non-workflow PR gate

on:
  pull_request_target:
    paths-ignore:
      - .github/workflows/**

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Confirm non-workflow PR
        run: echo "Non-workflow pull request; actionlint remains satisfied."
